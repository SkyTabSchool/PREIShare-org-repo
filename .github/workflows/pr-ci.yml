name: PR CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

# One run per pull request. A newer push cancels the in-progress run for that PR.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install Dependancies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inventory observation only. No engines, .nvmrc, or .node-version pin in the repo.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Clean install from package-lock.json. Package manager is npm.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
